<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <title>Not found</title>
    <script>
      // Prototypes moved from /prototypes/<slug>/ to /<slug>/.

        location.replace(location.pathname.replace("/prototypes/", "/") + location.search + location.hash);
      }
    </script>

      body { margin: 0; padding: 4rem 1.25rem; font: 14px/1.6 "Geist", ui-sans-serif, system-ui, sans-serif; }
